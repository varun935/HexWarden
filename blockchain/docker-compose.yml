services:
  network-init:
    image: hyperledger/besu:24.5.1
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ./config:/network
      - ./generated:/network/generated
    command: ["if [ ! -f /network/generated/genesis.json ]; then rm -rf /network/generated/* && besu operator generate-blockchain-config --config-file=/network/network-config.json --to=/network/generated --private-key-file-name=key; fi"]

  node1:
    image: hyperledger/besu:24.5.1
    entrypoint: ["/bin/sh", "-c"]
    depends_on:
      network-init:
        condition: service_completed_successfully
    environment: [NODE_INDEX=1]
    volumes: ["./generated:/network", "./node1:/opt/besu/data"]
    command: ["p1=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '1p')\"); p2=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '2p')\"); p3=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '3p')\"); p4=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '4p')\"); ip1=$$(getent hosts node1 | awk '{print $$1}'); ip2=$$(getent hosts node2 | awk '{print $$1}'); ip3=$$(getent hosts node3 | awk '{print $$1}'); ip4=$$(getent hosts node4 | awk '{print $$1}'); bootnodes=\"enode://$${p1#0x}@$${ip1}:30303,enode://$${p2#0x}@$${ip2}:30303,enode://$${p3#0x}@$${ip3}:30303,enode://$${p4#0x}@$${ip4}:30303\"; key=$$(find /network -type f -name key | sort | sed -n \"$${NODE_INDEX}p\") && cp \"$$key\" /opt/besu/data/key && exec besu --data-path=/opt/besu/data --genesis-file=/network/genesis.json --rpc-http-enabled --rpc-http-api=ETH,NET,WEB3,ADMIN,TXPOOL --rpc-http-host=0.0.0.0 --host-allowlist=\"*\" --p2p-host=0.0.0.0 --bootnodes=\"$${bootnodes}\""]
    ports: ["8545:8545", "30303:30303"]

  node2:
    image: hyperledger/besu:24.5.1
    entrypoint: ["/bin/sh", "-c"]
    depends_on: {network-init: {condition: service_completed_successfully}}
    environment: [NODE_INDEX=2]
    volumes: ["./generated:/network", "./node2:/opt/besu/data"]
    command: ["p1=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '1p')\"); p2=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '2p')\"); p3=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '3p')\"); p4=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '4p')\"); ip1=$$(getent hosts node1 | awk '{print $$1}'); ip2=$$(getent hosts node2 | awk '{print $$1}'); ip3=$$(getent hosts node3 | awk '{print $$1}'); ip4=$$(getent hosts node4 | awk '{print $$1}'); bootnodes=\"enode://$${p1#0x}@$${ip1}:30303,enode://$${p2#0x}@$${ip2}:30303,enode://$${p3#0x}@$${ip3}:30303,enode://$${p4#0x}@$${ip4}:30303\"; key=$$(find /network -type f -name key | sort | sed -n \"$${NODE_INDEX}p\") && cp \"$$key\" /opt/besu/data/key && exec besu --data-path=/opt/besu/data --genesis-file=/network/genesis.json --rpc-http-enabled --rpc-http-api=ETH,NET,WEB3,ADMIN,TXPOOL --rpc-http-host=0.0.0.0 --host-allowlist=\"*\" --p2p-host=0.0.0.0 --bootnodes=\"$${bootnodes}\""]
    ports: ["8546:8545", "30304:30303"]

  node3:
    image: hyperledger/besu:24.5.1
    entrypoint: ["/bin/sh", "-c"]
    depends_on: {network-init: {condition: service_completed_successfully}}
    environment: [NODE_INDEX=3]
    volumes: ["./generated:/network", "./node3:/opt/besu/data"]
    command: ["p1=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '1p')\"); p2=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '2p')\"); p3=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '3p')\"); p4=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '4p')\"); ip1=$$(getent hosts node1 | awk '{print $$1}'); ip2=$$(getent hosts node2 | awk '{print $$1}'); ip3=$$(getent hosts node3 | awk '{print $$1}'); ip4=$$(getent hosts node4 | awk '{print $$1}'); bootnodes=\"enode://$${p1#0x}@$${ip1}:30303,enode://$${p2#0x}@$${ip2}:30303,enode://$${p3#0x}@$${ip3}:30303,enode://$${p4#0x}@$${ip4}:30303\"; key=$$(find /network -type f -name key | sort | sed -n \"$${NODE_INDEX}p\") && cp \"$$key\" /opt/besu/data/key && exec besu --data-path=/opt/besu/data --genesis-file=/network/genesis.json --rpc-http-enabled --rpc-http-api=ETH,NET,WEB3,ADMIN,TXPOOL --rpc-http-host=0.0.0.0 --host-allowlist=\"*\" --p2p-host=0.0.0.0 --bootnodes=\"$${bootnodes}\""]
    ports: ["8547:8545", "30305:30303"]

  node4:
    image: hyperledger/besu:24.5.1
    entrypoint: ["/bin/sh", "-c"]
    depends_on: {network-init: {condition: service_completed_successfully}}
    environment: [NODE_INDEX=4]
    volumes: ["./generated:/network", "./node4:/opt/besu/data"]
    command: ["p1=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '1p')\"); p2=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '2p')\"); p3=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '3p')\"); p4=$$(cat \"$$(find /network/keys -type f -name key.pub | sort | sed -n '4p')\"); ip1=$$(getent hosts node1 | awk '{print $$1}'); ip2=$$(getent hosts node2 | awk '{print $$1}'); ip3=$$(getent hosts node3 | awk '{print $$1}'); ip4=$$(getent hosts node4 | awk '{print $$1}'); bootnodes=\"enode://$${p1#0x}@$${ip1}:30303,enode://$${p2#0x}@$${ip2}:30303,enode://$${p3#0x}@$${ip3}:30303,enode://$${p4#0x}@$${ip4}:30303\"; key=$$(find /network -type f -name key | sort | sed -n \"$${NODE_INDEX}p\") && cp \"$$key\" /opt/besu/data/key && exec besu --data-path=/opt/besu/data --genesis-file=/network/genesis.json --rpc-http-enabled --rpc-http-api=ETH,NET,WEB3,ADMIN,TXPOOL --rpc-http-host=0.0.0.0 --host-allowlist=\"*\" --p2p-host=0.0.0.0 --bootnodes=\"$${bootnodes}\""]
    ports: ["8548:8545", "30306:30303"]