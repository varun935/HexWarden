<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Scans &mdash; HexWarden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include "_nav.html" %}
  <div class="page">
    <header class="page-header">
      <h1>Scan Comparison</h1>
      <p class="page-subtitle">Two scans side by side &mdash; clean reference vs suspect firmware.</p>
    </header>

    <div class="compare-grid">
      <div class="compare-col" id="compare-col-a">
        <p class="compare-loading">Loading&hellip;</p>
      </div>
      <div class="compare-col" id="compare-col-b">
        <p class="compare-loading">Loading&hellip;</p>
      </div>
    </div>

    <div class="compare-diff" id="compare-diff" hidden>
      <h2>Difference</h2>
      <p class="compare-diff-text" id="compare-diff-text"></p>
    </div>
  </div>

  <script>
    window.COMPARE_A = {{ scan_a_id | tojson }};
    window.COMPARE_B = {{ scan_b_id | tojson }};
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>

  <!-- Lenis for smooth scrolling -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
  <script>
    if (typeof Lenis !== 'undefined') {
      const lenis = new Lenis({
        lerp: 0.08,           // exponential-decay lerp — Apple-style inertia
        smoothWheel: true,
        smoothTouch: false,   // keep native momentum on trackpad/touch
      });

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
    }
  </script>
</body>
</html>
